<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <script>
      // [261124] 다른 탭으로 바꾸거나 창을 최소화하면 사운드 정지, 돌아오면 재개 (Unity 로더보다 먼저 실행되어야 함)
      (function () {
        const contexts = [];
        const media = [];
        const pausedByTab = new Set();
        const mutedByTab = new Set();
        const wrapped = new Map();

        ["AudioContext", "webkitAudioContext"].forEach(function (name) {
          const Original = window[name];
          if (typeof Original !== "function") return;
          if (wrapped.has(Original)) { window[name] = wrapped.get(Original); return; }
          const Tracked = function () {
            const ctx = new (Function.prototype.bind.apply(Original, [null].concat(Array.prototype.slice.call(arguments))))();
            contexts.push(ctx);
            if (document.hidden && ctx.state === "running") { ctx.suspend(); pausedByTab.add(ctx); }
            return ctx;
          };
          Tracked.prototype = Original.prototype;
          Object.setPrototypeOf(Tracked, Original);
          wrapped.set(Original, Tracked);
          window[name] = Tracked;
        });

        const createElement = document.createElement.bind(document);
        document.createElement = function (tag, options) {
          const el = createElement(tag, options);
          if (/^(audio|video)$/i.test(String(tag))) media.push(el);
          return el;
        };

        function applyVisibility() {
          const hidden = document.hidden;
          contexts.forEach(function (ctx) {
            if (hidden) {
              if (ctx.state === "running") { ctx.suspend(); pausedByTab.add(ctx); }
            } else if (pausedByTab.has(ctx)) {
              pausedByTab.delete(ctx);
              Promise.resolve(ctx.resume()).catch(function () {});
            }
          });
          document.querySelectorAll("audio, video").forEach(function (el) { if (media.indexOf(el) < 0) media.push(el); });
          media.forEach(function (el) {
            if (hidden) {
              if (!el.muted) { el.muted = true; mutedByTab.add(el); }
            } else if (mutedByTab.has(el)) {
              mutedByTab.delete(el);
              el.muted = false;
            }
          });
        }
        document.addEventListener("visibilitychange", applyVisibility);
        window.addEventListener("pagehide", applyVisibility);
        window.addEventListener("pageshow", applyVisibility);
      })();
    </script>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>독수리작전</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body class="dark">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
      <div id="unity-loading-bar">
          <div id="unity-logo"><img src="TemplateData/logo.png"></div>
            <div id="unity-progress-bar-empty" style="display: none;">
              <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
          </div>
        </div>
        <div id="unity-fullscreen-button" style="display: none;"></div>
        <script>
          const hideFullScreenButton = "";
          const buildUrl = "Build";
          const loaderUrl = buildUrl + "/html_eagle_.loader.js";
          const config = {
            dataUrl: buildUrl + "/html_eagle_.data.unityweb",
            frameworkUrl: buildUrl + "/html_eagle_.framework.js.unityweb",
            codeUrl: buildUrl + "/html_eagle_.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "cowdragon",
            productName: "독수리작전",
            productVersion: "1.0",
          };

          const container = document.querySelector("#unity-container");
          const canvas = document.querySelector("#unity-canvas");
          const loadingCover = document.querySelector("#loading-cover");
          const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
          const progressBarFull = document.querySelector("#unity-progress-bar-full");
          const fullscreenButton = document.querySelector("#unity-fullscreen-button");
          const spinner = document.querySelector('.spinner');

          const canFullscreen = (function() {
            for (const key of [
                'exitFullscreen',
                'webkitExitFullscreen',
                'webkitCancelFullScreen',
                'mozCancelFullScreen',
                'msExitFullscreen',
              ]) {
              if (key in document) {
                return true;
              }
            }
            return false;
          }());

          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            config.devicePixelRatio = 1;
          }
          loadingCover.style.display = "";

          const script = document.createElement("script");
          script.src = loaderUrl;
          script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
              spinner.style.display = "none";
              progressBarEmpty.style.display = "";
              progressBarFull.style.width = `${100 * progress}%`;
            }).then((unityInstance) => {
              loadingCover.style.display = "none";
              if (canFullscreen) {
                if (!hideFullScreenButton) {
                  fullscreenButton.style.display = "";
                }
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }
            }).catch((message) => {
              alert(message);
            });
          };
          document.body.appendChild(script);
        </script>
      </body>
    </html>

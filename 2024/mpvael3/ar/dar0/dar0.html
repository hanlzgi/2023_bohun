<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script>
      // [261124] 다른 탭으로 바꾸거나 창을 최소화하면 사운드 정지, 돌아오면 재개 (Unity 로더보다 먼저 실행되어야 함)
      (function () {
        const contexts = [];
        const media = [];
        const pausedByTab = new Set();
        const mutedByTab = new Set();
        const wrapped = new Map();

        ["AudioContext", "webkitAudioContext"].forEach(function (name) {
          const Original = window[name];
          if (typeof Original !== "function") return;
          if (wrapped.has(Original)) { window[name] = wrapped.get(Original); return; }
          const Tracked = function () {
            const ctx = new (Function.prototype.bind.apply(Original, [null].concat(Array.prototype.slice.call(arguments))))();
            contexts.push(ctx);
            if (document.hidden && ctx.state === "running") { ctx.suspend(); pausedByTab.add(ctx); }
            return ctx;
          };
          Tracked.prototype = Original.prototype;
          Object.setPrototypeOf(Tracked, Original);
          wrapped.set(Original, Tracked);
          window[name] = Tracked;
        });

        const createElement = document.createElement.bind(document);
        document.createElement = function (tag, options) {
          const el = createElement(tag, options);
          if (/^(audio|video)$/i.test(String(tag))) media.push(el);
          return el;
        };

        function applyVisibility() {
          const hidden = document.hidden;
          contexts.forEach(function (ctx) {
            if (hidden) {
              if (ctx.state === "running") { ctx.suspend(); pausedByTab.add(ctx); }
            } else if (pausedByTab.has(ctx)) {
              pausedByTab.delete(ctx);
              Promise.resolve(ctx.resume()).catch(function () {});
            }
          });
          document.querySelectorAll("audio, video").forEach(function (el) { if (media.indexOf(el) < 0) media.push(el); });
          media.forEach(function (el) {
            if (hidden) {
              if (!el.muted) { el.muted = true; mutedByTab.add(el); }
            } else if (mutedByTab.has(el)) {
              mutedByTab.delete(el);
              el.muted = false;
            }
          });
        }
        document.addEventListener("visibilitychange", applyVisibility);
        window.addEventListener("pagehide", applyVisibility);
        window.addEventListener("pageshow", applyVisibility);
      })();
    </script>
    <meta name="viewport" content='width=device-width, initial-scale=1.0, viewport-fit=cover'>
    <title>Unity WebGL Player | bohoon_webAR</title>
    <link rel="icon" href="TemplateData/favicon.ico">

<body class="intro-layout">
    <main id="web-player">
    <!--IMAGETARGETS-->
		<imagetarget id='MARKER_hokook_01' src='targets/MARKER_hokook_01.PNG'></imagetarget>
		<imagetarget id='MARKER_hokook_02' src='targets/MARKER_hokook_02.PNG'></imagetarget>
		<imagetarget id='MARKER_dockrip_01' src='targets/MARKER_dockrip_01.PNG'></imagetarget>
		<imagetarget id='MARKER_dockrip_02' src='targets/MARKER_dockrip_02.PNG'></imagetarget>
		<imagetarget id='MARKER_minju_01' src='targets/MARKER_minju_01.PNG'></imagetarget>
		<imagetarget id='MARKER_intro' src='targets/MARKER_intro.png'></imagetarget>

    <video id="webcam-video" muted autoplay playsinline style="width:1px;position:absolute"></video>
    <!-- <video id="webcam-video" muted autoplay playsinline style="width:100%; height:100%; object-fit:cover; position:absolute"></video> -->
    <div id="startARDiv" class="ctaDiv">
        <select id="chooseCamSel" style="display: none;" onchange="SelectCam()"></select>
        <p style="text-align: center; width:60vw;">AR 콘텐츠를 체험하려면<br>장치의 카메라 기능을 사용하도록 허락해주세요.</p>
        <button id="startARButton" onclick="StartAR(false)" style="display:none">장치 사용</button>
    </div>
    <div id="screenshotDiv" style="display: none;" class="ctaDiv">
        <div style="position:relative; background-color:white; padding:10px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3), 0 6px 20px 0 rgba(0, 0, 0, 0.25);">
            <img id="screenshotImg" alt="screenshot">
            <button onclick="document.getElementById('screenshotDiv').style.display = 'none';" style="position:absolute; transform:translateY(-100%); right:0; top:0">Close</button>
        </div>
    </div>
    <div id="confirmUrlDiv" style="display: none;" class="ctaDiv">
        <div style="position:relative; background-color:white; padding:10px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3), 0 6px 20px 0 rgba(0, 0, 0, 0.25); width: 80vw; display:flex; flex-direction: column; align-items: center;">
            <p id="confirmUrlText" style="text-align: center; width:80%; overflow: hidden; text-overflow: ellipsis;">Are you sure you want to visit url.com?</p>
            <div>
                <button onclick="window.open(newUrlString, '_blank', 'noopener'); document.getElementById('confirmUrlDiv').style.display = 'none'">VISIT SITE</button>
                <button onclick="document.getElementById('confirmUrlDiv').style.display = 'none'">GO BACK</button>
            </div>
        </div>
    </div>
    <div id="errorDiv" class="ctaDiv" style="display: none; background:#aaa">
        <p id="errorText" style="text-align: center; width:60vw; color:white"></p>
    </div>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="0"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <canvas id="video-canvas"></canvas>
    </div>
    <button id="unity-fullscreen-button" type="button" aria-label="전체화면" hidden></button>
    </main>
    <script src="arcamera.js" type="text/javascript"></script>
    <script src="itracker.js" type="text/javascript"></script>
    <script src="Build/오늘은나라사랑의날.loader.js"></script>
    <script>
            const player = document.getElementById("web-player");
            const autoStart = document.body.classList.contains("intro-layout");
            const canvas = document.getElementById("unity-canvas");
            const loadingBar = document.getElementById("unity-loading-bar");
            const progressBarFull = document.getElementById("unity-progress-bar-full");
            const startButton = document.getElementById("startARButton");
            const fullscreenButton = document.getElementById("unity-fullscreen-button");
            const video = document.getElementById("webcam-video");
            let unityReady;
            let cameraPermission;
            let webcamStarting;
            async function initialize() {
                try {
                    window.arCamera = new ARCamera(canvas, document.getElementById("video-canvas"));
                    // The SDK's resize handler briefly hides the canvas. Size the player
                    // with CSS and refresh tracking only after its dimensions settle.
                    window.removeEventListener("resize", arCamera.resizeWithDelay, true);
                    window.iTracker = new ImageTracker(arCamera);
                    await iTracker.initialize();
                    if (autoStart) {
                        StartAR(false);
                        return;
                    }
                    const devices = await navigator.mediaDevices?.enumerateDevices().catch(() => []);
                    const cameras = (devices || []).filter(device => device.kind === "videoinput");
                    if (cameras.length) {
                        const select = document.getElementById("chooseCamSel");
                        cameras.reverse().forEach((camera, index) => {
                            select.add(new Option(camera.label || "Camera " + index, camera.deviceId));
                        });
                        iTracker.WEBCAM_NAME = select.options[0].text;
                    } else {
                        document.querySelector("#startARDiv p").textContent =
                            "카메라 없이 콘텐츠를 시작할 수 있습니다.";
                        startButton.textContent = "시작";
                        startButton.onclick = () => StartAR(true);
                    }
                    startButton.style.display = "block";
                } catch (error) {
                    console.error("ImageTracker initialization failed", error);
                    loadingBar.hidden = true;
                    ShowError("콘텐츠를 초기화하지 못했습니다. 페이지를 새로고침해 주세요.");
                }
            }
            function updateViewport() {
                const viewport = window.visualViewport;
                const useVisualViewport = viewport && viewport.scale === 1;
                player.style.setProperty("--viewport-height", (useVisualViewport ? viewport.height : innerHeight) + "px");
                player.style.setProperty("--viewport-top", (useVisualViewport ? viewport.offsetTop : 0) + "px");
            }
            window.addEventListener("resize", updateViewport);
            window.addEventListener("orientationchange", updateViewport);
            window.visualViewport?.addEventListener("resize", updateViewport);
            window.visualViewport?.addEventListener("scroll", updateViewport);
            window.addEventListener("pageshow", updateViewport);
            updateViewport();
            let resizeTimer;
            new ResizeObserver(() => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (window.unityInstance && video.videoWidth && arCamera.isCameraStarted) {
                        arCamera.resizeCanvas();
                    }
                }, 150);
            }).observe(canvas);
            video.addEventListener("resize", () => {
                if (window.unityInstance && arCamera.isCameraStarted) arCamera.resizeCanvas();
            });
            function resumeWebcam() {
                if (video.paused && video.srcObject && !arCamera.cameraPaused) {
                    video.play().catch(error => console.warn("Camera resume failed", error));
                }
            }
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) resumeWebcam();
            });
            document.addEventListener("resume", resumeWebcam);
            window.addEventListener("pageshow", resumeWebcam);
            window.addEventListener("focus", resumeWebcam);
            function TouchStart() {
                if (!autoStart && !fullscreenElement() && fullscreenRequest() && navigator.userActivation?.isActive) {
                    toggleFullscreen();
                }
            }
            function StartAR(isPC) {
                if (unityReady) return;
                document.getElementById("startARDiv").style.display = "none";
                loadingBar.style.display = "block";
                if (!autoStart) cameraPermission = isPC ? Promise.resolve() : RequestWebcam();
                unityReady = Promise.resolve().then(() =>
                createUnityInstance(canvas, {
                    dataUrl: "Build/오늘은나라사랑의날.data.unityweb",
                    frameworkUrl: "Build/오늘은나라사랑의날.framework.js.unityweb",
                    codeUrl: "Build/오늘은나라사랑의날.wasm.unityweb",
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "DefaultCompany",
                    productName: "bohoon_webAR",
                    productVersion: "0.1",
                    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
                    },
                    (progress) => {
                        progressBarFull.style.width = 100 * progress + "%";
                    }
                )).then(instance => {
                    window.unityInstance = instance;
                    const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
                    if (isiOS) instance.SendMessage("PCMode_Obj", "IOSSetting");
                    loadingBar.hidden = true;
                    loadingBar.style.display = "none";
                    fullscreenButton.hidden = autoStart || !fullscreenRequest();
                    return instance;
                }).catch(error => {
                    console.error("Unity startup failed", error);
                    loadingBar.style.display = "none";
                    ShowError("게임을 불러오지 못했습니다. 페이지를 새로고침해 주세요.");
                    return null;
                });
                if (autoStart) {
                    cameraPermission = unityReady.then(async instance => {
                        if (!instance) return;
                        await RequestWebcam();
                        if (!window.webcamStream) instance.SendMessage("PCMode_Obj", "DisableARCam");
                    });
                }
                if (isPC) {
                    unityReady.then(instance => instance?.SendMessage("PCMode_Obj", "DisableARCam"));
                }
            }
            //Set Facing Mode here ('environment', 'user', '')
		window.unityFacingMode = "environment"
            window.WEBCAM_SETTINGS = {
                video: {
                    facingMode: unityFacingMode,
                },
                audio: false
            };
            async function RequestWebcam() {
                try {
                    if (autoStart && !navigator.mediaDevices?.getUserMedia) return;
                    window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                } catch (error) {
                    console.warn("Camera access failed", error);
                    if (!autoStart) ShowError("카메라를 사용할 수 없습니다. 브라우저 권한을 확인한 뒤 새로고침해 주세요.");
                }
            }
            function StartWebcam() {
                if (webcamStarting) return webcamStarting;
                webcamStarting = (async () => {
                    await cameraPermission;
                    const instance = await unityReady;
                    if (!instance || !window.webcamStream) return;
                    video.srcObject = window.webcamStream;
                    try {
                        await arCamera.startWebcam(video);
                        instance.SendMessage("ARCamera", "OnStartWebcamSuccess");
                    } catch (error) {
                        if (autoStart) {
                            console.warn("Camera startup failed", error);
                            window.webcamStream.getTracks().forEach(track => track.stop());
                            window.webcamStream = null;
                            video.srcObject = null;
                            instance.SendMessage("PCMode_Obj", "DisableARCam");
                            return;
                        }
                        console.error("Camera startup failed", error);
                        instance.SendMessage("ARCamera", "OnStartWebcamFail");
                        ShowError("카메라를 시작하지 못했습니다. 페이지를 새로고침해 주세요.");
                    }
                })().finally(() => { webcamStarting = null; });
                return webcamStarting;
            }
            function SelectCam(){
                var select = document.getElementById("chooseCamSel");
                window.deviceId = select.value;
                window.WEBCAM_SETTINGS.video['deviceId'] = deviceId;
                //console.log(window.WEBCAM_SETTINGS);
                iTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
            }
            async function FlipCam(){
                arCamera.stopWebcam();
                window.WEBCAM_SETTINGS.video.deviceId = '';
                if(window.WEBCAM_SETTINGS.video.facingMode == 'user'){
                    window.WEBCAM_SETTINGS.video.facingMode = 'environment';
                    arCamera.setFlipped(false);
                }
                else{
                    window.WEBCAM_SETTINGS.video.facingMode = 'user';
                    arCamera.setFlipped(true);
                }
                window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                const video = document.querySelector("#webcam-video");
                video.srcObject = webcamStream;
                await arCamera.startWebcam(video);
            }
            function ShowError(error){
                document.getElementById("errorDiv").style.display = "flex";
                document.getElementById("errorText").textContent = error;
            }
            function ShowScreenshot(dataUrl){
                document.getElementById("screenshotDiv").style.display = "flex";
                document.getElementById("screenshotImg").src = dataUrl;
            }
            function ShowConfirmUrl(url){
                document.getElementById("confirmUrlDiv").style.display = "flex";
                window.newUrlString = url;
                document.getElementById("confirmUrlText").innerText = "Are you sure you want to visit " + url;                
            }
            window.ITRACKER_GLOBALS = {
                //place global settings here
                INTERNAL_SMOOTHFACTOR_POS: .075,
            }   
            function fullscreenElement() {
                return document.fullscreenElement || document.webkitFullscreenElement;
            }
            function fullscreenRequest() {
                if (document.fullscreenEnabled && player.requestFullscreen) return player.requestFullscreen;
                if (document.webkitFullscreenEnabled && player.webkitRequestFullscreen) return player.webkitRequestFullscreen;
                return null;
            }
            function enterFullscreenOnFirstInput(event) {
                if (!event.isTrusted || !event.isPrimary || event.button !== 0) return;
                if (event.target !== canvas && event.target !== player) return;
                player.removeEventListener("pointerup", enterFullscreenOnFirstInput, true);
                if (!fullscreenElement() && fullscreenRequest()) {
                    // Request before returning from the native gesture handler.
                    toggleFullscreen();
                }
            }
            async function toggleFullscreen() {
                try {
                    if (fullscreenElement() === player) {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen;
                        await exit.call(document);
                    } else if (!fullscreenElement()) {
                        await fullscreenRequest()?.call(player);
                    }
                } catch (error) {
                    // Keep the same fitted browser view if fullscreen is refused.
                    console.warn("Fullscreen unavailable", error);
                }
            }
            function updateFullscreen() {
                const active = fullscreenElement() === player;
                fullscreenButton.setAttribute("aria-label", active ? "전체화면 닫기" : "전체화면");
                fullscreenButton.setAttribute("aria-pressed", String(active));
                updateViewport();
            }
            fullscreenButton.addEventListener("click", toggleFullscreen);
            if (autoStart) player.addEventListener("pointerup", enterFullscreenOnFirstInput, true);
            document.addEventListener("fullscreenchange", updateFullscreen);
            document.addEventListener("webkitfullscreenchange", updateFullscreen);
            initialize();
    </script>

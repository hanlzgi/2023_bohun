<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>방방곡곡</title>
  <style>
    html, body { margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; }
    body { overflow: hidden; }
    #viewport { position: fixed; inset: 0; height: 100vh; height: 100dvh; }
    #game-area {
      position: absolute;
      inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      display: grid;
      place-items: center;
    }
    #viewport.with-fullscreen #game-area {
      bottom: calc(env(safe-area-inset-bottom, 0px) + 2rem);
    }
    #fullscreen {
      position: absolute;
      right: max(.5rem, env(safe-area-inset-right, 0px));
      bottom: env(safe-area-inset-bottom, 0px);
      height: 2rem;
      border: 0;
      padding: 0 .625rem;
      background: #242424;
      color: #fff;
      cursor: pointer;
    }
    #unity-container { position: relative; }
    #unity-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: .5rem; }
    #loading[hidden], [hidden] { display: none; }
    #notice {
      position: absolute; z-index: 1; top: .5rem; left: 50%; transform: translateX(-50%);
      width: max-content; max-width: 90%; color: #fff; background: #242424;
    }
    #notice p { margin: 0; padding: .5rem .75rem; }
    #notice [role="alert"] { background: #8d2020; }
    #rotate {
      position: absolute; bottom: calc(50% + var(--game-height, 0px) / 2 + .5rem);
      margin: 0; padding: 0 .75rem; text-align: center; font-size: .875rem;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate:not([hidden]) { display: block; }
    }
  </style>
</head>
<body>
  <main id="viewport">
    <div id="game-area">
      <div id="unity-container">
        <canvas id="unity-canvas" width="960" height="540" tabindex="-1" aria-label="방방곡곡 게임"></canvas>
        <div id="loading" role="status">
          <label for="progress">게임 불러오는 중</label>
          <progress id="progress" max="1" value="0"></progress>
        </div>
      </div>
      <p id="rotate" hidden>가로로 돌리면 게임을 더 크게 볼 수 있어요.</p>
      <div id="notice"></div>
    </div>
    <button id="fullscreen" type="button" hidden>전체화면</button>
  </main>
  <script>
    // [261119] 탭이 보일 때만 소리 재생: 탭이 가려지면 Unity 오디오를 멈추고, 다시 보이면 이어서 재생
    // Unity 로더보다 먼저 실행되어야 게임이 만드는 오디오를 붙잡을 수 있음
    (function () {
      const contexts = [];   // 게임이 만든 WebAudio(AudioContext)
      const media = [];      // 게임이 만든 audio/video 요소(영상·배경음 대비)
      const pausedByTab = new Set();
      const mutedByTab = new Set();

      ["AudioContext", "webkitAudioContext"].forEach(name => {
        const Original = window[name];
        if (typeof Original !== "function") return;
        const Tracked = function (...args) {
          const ctx = new Original(...args);
          contexts.push(ctx);
          if (document.hidden && ctx.state === "running") { ctx.suspend(); pausedByTab.add(ctx); }
          return ctx;
        };
        Tracked.prototype = Original.prototype;
        Object.setPrototypeOf(Tracked, Original);
        window[name] = Tracked;
      });

      const createElement = document.createElement.bind(document);
      document.createElement = function (tag, options) {
        const el = createElement(tag, options);
        if (/^(audio|video)$/i.test(String(tag))) media.push(el);
        return el;
      };

      function applyVisibility() {
        const hidden = document.hidden;
        contexts.forEach(ctx => {
          if (hidden) {
            if (ctx.state === "running") { ctx.suspend(); pausedByTab.add(ctx); }
          } else if (pausedByTab.has(ctx)) {
            pausedByTab.delete(ctx);
            ctx.resume().catch(() => {});
          }
        });
        document.querySelectorAll("audio, video").forEach(el => { if (!media.includes(el)) media.push(el); });
        media.forEach(el => {
          if (hidden) {
            if (!el.muted) { el.muted = true; mutedByTab.add(el); }
          } else if (mutedByTab.has(el)) {
            mutedByTab.delete(el);
            el.muted = false;
          }
        });
      }
      document.addEventListener("visibilitychange", applyVisibility);
      window.addEventListener("pagehide", applyVisibility);
      window.addEventListener("pageshow", applyVisibility);
    })();
  </script>
  <script>
    const viewport = document.getElementById("viewport");
    const fullscreen = document.getElementById("fullscreen");
    const area = document.getElementById("game-area");
    const container = document.getElementById("unity-container");
    const canvas = document.getElementById("unity-canvas");
    const loading = document.getElementById("loading");
    const progress = document.getElementById("progress");
    const notice = document.getElementById("notice");
    const rotate = document.getElementById("rotate");
    const touchScreen = window.matchMedia("(pointer: coarse)");
    const portrait = window.matchMedia("(orientation: portrait)");

    function fitGame() {
      const width = Math.min(area.clientWidth, area.clientHeight * 16 / 9);
      const height = width * 9 / 16;
      container.style.width = width + "px";
      container.style.height = height + "px";
      area.style.setProperty("--game-height", height + "px");
      rotate.hidden = !(touchScreen.matches && portrait.matches);
    }
    // Older mobile browsers expose the visible height through VisualViewport.
    const visualViewport = window.visualViewport;
    if (visualViewport && !CSS.supports("height", "100dvh")) {
      function fitVisibleViewport() {
        if (visualViewport.scale === 1) viewport.style.height = visualViewport.height + "px";
      }
      visualViewport.addEventListener("resize", fitVisibleViewport);
      fitVisibleViewport();
    }

    fitGame();
    new ResizeObserver(fitGame).observe(area);
    portrait.addEventListener("change", fitGame);
    touchScreen.addEventListener("change", fitGame);

    function showBanner(message, type) {
      const banner = document.createElement("p");
      banner.textContent = message;
      banner.setAttribute("role", type === "error" ? "alert" : "status");
      notice.append(banner);
      if (type !== "error") setTimeout(() => banner.remove(), 5000);
    }

    // Request fullscreen through the button gesture. The canvas remains fitted within the viewport.
    if (viewport.requestFullscreen && document.fullscreenEnabled) {
      function updateFullscreenControl() {
        fullscreen.hidden = Boolean(document.fullscreenElement);
        viewport.classList.toggle("with-fullscreen", !fullscreen.hidden);
      }
      document.addEventListener("fullscreenchange", updateFullscreenControl);
      fullscreen.addEventListener("click", async () => {
        try {
          await viewport.requestFullscreen();
        } catch {
          showBanner("이 브라우저에서 전체화면을 열 수 없습니다.", "warning");
        }
      });
      updateFullscreenControl();
    }

    const build = "Build/";
    const config = {
      arguments: [],
      dataUrl: build + "webNarasarang_boardGame.data.br",
      frameworkUrl: build + "webNarasarang_boardGame.framework.js.br",
      codeUrl: build + "webNarasarang_boardGame.wasm.br",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "webAR_narasarang",
      productVersion: "0.1",
      showBanner,
    };
    if (touchScreen.matches) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

    function loadFailed(message) {
      loading.hidden = true;
      showBanner("게임을 시작할 수 없습니다. " + message, "error");
    }

    const script = document.createElement("script");
    script.src = build + "webNarasarang_boardGame.loader.js";
    script.onerror = () => loadFailed("게임 로더를 불러오지 못했습니다.");
    script.onload = () => {
      createUnityInstance(canvas, config, value => { progress.value = value; })
        .then(() => { loading.hidden = true; })
        .catch(loadFailed);
    };
    document.body.append(script);
  </script>
</body>
</html>

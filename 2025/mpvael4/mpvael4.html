<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="방방곡곡 나라사랑 전자책 - 역사적 장소와 독립 운동 이야기">
    <meta name="theme-color" content="#1a73e8">
    <meta name="color-scheme" content="light only">
    <title>방방곡곡 나라사랑 설명책</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="./img/ICImage.png">
</head>
<body>
    <div class="container">
        <header class="book-header" role="banner">
            <div class="header-logo">
                <img src="./img/logo.png" alt="국가보훈부 로고">
            </div>
            
            <button id="hamburgerBtn" class="hamburger-btn" aria-label="메뉴 열기">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div id="mobileMenu" class="mobile-menu">
                <div class="menu-items">
                    <button id="bookmarkBtn" class="menu-item" title="북마크 토글 (B)">
                        <img src="./img/1_bookmark.svg" class="menu-icon" alt="북마크">
                        <span>북마크</span>
                    </button>
                    <button id="memoBtn" class="menu-item" title="메모 작성 (M)">
                        <img src="./img/2_memo.svg" class="menu-icon" alt="메모">
                        <span>메모</span>
                    </button>
                    <button id="searchBtn" class="menu-item" title="검색">
                            <img src="./img/3_search.svg" class="menu-icon" alt="검색">
                            <span>검색</span>
                    </button>
                    <button id="settingsBtn" class="menu-item" title="설정">
                        <img src="./img/4_setting.svg" class="menu-icon" alt="설정">
                        <span>설정</span>
                    </button>
                    <button id="downloadBtn" class="menu-item" title="PDF 다운로드">
                        <img src="./img/5_download.svg" class="menu-icon" alt="다운로드">
                        <span>다운로드</span>
                    </button>
                    <button id="fullscreenBtn" class="menu-item" title="전체화면 (F11)">
                        <img src="./img/6_fullscreen.svg" class="menu-icon" alt="전체화면">
                        <span>전체화면</span>
                    </button>
                </div>
            </div>
        </header>
        
        <div class="content-wrapper">
            <button id="prevButton" class="nav-button nav-button-left" aria-label="이전 페이지로 이동">
                <span>◀</span>
            </button>
            
            <main class="book-content" role="main">
                <div id="pageContent" class="page-content" tabindex="-1">
                    <div class="loading" role="status" aria-live="polite">
                        <h2>📚 방방곡곡 나라사랑</h2>
                        <p>전자책을 불러오는 중입니다...</p>
                    </div>
                </div>
            </main>
            
            <button id="nextButton" class="nav-button nav-button-right" aria-label="다음 페이지로 이동">
                <span>▶</span>
            </button>
        </div>

        <div class="bottom-controls">
            <div class="page-indicator">
                <label for="pageSelector">페이지:</label>
                <select id="pageSelector" class="page-selector" aria-label="페이지 선택"></select>
                <span class="page-number">
                    <span id="currentPage" aria-label="현재 페이지">1</span> / 
                    <span id="totalPages" aria-label="전체 페이지">108</span>
                </span>
            </div>
        </div>
        
        <footer role="contentinfo">
            <p>Copyright ⓒ Ministry of Patriots & Veterans Affairs. All Rights Reserved.</p>
        </footer>
    </div>

    <div id="searchModal" class="modal" role="dialog" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header"><h2>검색</h2><button class="modal-close">✕</button></div>
            <div class="modal-body">
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="검색어 입력">
                    <button id="searchExecuteBtn" class="search-btn">검색</button>
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal" role="dialog" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header"><h2>설정</h2><button class="modal-close">✕</button></div>
            <div class="modal-body">
                <div class="settings-section">
                    <h3>진행 상황</h3>
                    <div class="progress-info">
                        <p>페이지: <span id="visitedCount">0</span> / <span id="totalCount">108</span></p>
                        <p>진행률: <span id="progressPercent">0%</span></p>
                        <p>시간: <span id="totalReadingTime">0분</span></p>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>북마크</h3>
                   <div class="bookmark-controls">
                        <button id="showBookmarksBtn" class="action-btn" style="width: 100%;">목록 보기</button>
                        </div>
                </div>
            </div>
        </div>
    </div>

    <div id="bookmarkModal" class="modal" role="dialog" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header"><h2>북마크 목록</h2><button class="modal-close">✕</button></div>
            <div class="modal-body"><div id="bookmarkList" class="bookmark-list"></div></div>
        </div>
    </div>

    <div id="announcements" aria-live="polite" aria-atomic="true" class="sr-only"></div>
    <script src="script.js"></script>
</body>
</html>
